---
layout: default
---
{% assign post_date = page.date | date: "%Y.%m.%d" %}
{% assign post_cat = page.category | default: "Note" %}
<article class="wrap article-container">
    <div class="measure">
        <header class="article-header">
            {% include section-label.html en=post_cat zh=post_date %}
            <h1 class="article-title">{{ page.title }}</h1>
        </header>

        <div class="prose">
            {{ content }}
        </div>
    </div>
</article>
