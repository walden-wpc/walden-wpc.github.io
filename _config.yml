title: Walden
# subtitle: ""  # 首頁副標題，填入內容即可開啟
description: 張文柏的個人網站
image: /assets/images/walden_card.webp
url: "https://walden-wpc.github.io"

# ===================================================================
# 網站上所有會被看到的固定文字，全部在這一段。
# 想改任何一個字，改這裡就好，不用進版型檔案。
#
# 注意：Jekyll 不會監看這個檔案。改完 _config.yml 一定要「重啟」
# jekyll serve（Ctrl+C 再跑一次）才看得到，光重新整理瀏覽器沒有用。
# 其他檔案（.md / .html / .css）才會自動重建。
# ===================================================================

# 首頁水面上的文字
hero:
  name_zh: 張文柏
  name_en: WEN-PO CHANG
  tagline: 神經科學背景，習慣從複雜的資料裡梳理出架構。現在把這件事帶到醫療與科技的交會處，順手把靈感做成能用的工具。
  # 「可以點擊」的提示不用文字，是 style.css 裡的 .hero-cue（一圈一圈盪開的墨點）

ui:
  # 導覽列
  nav_home: ← Home
  nav_projects: Projects
  nav_notes: Notes
  nav_about: About
  skip_link: 跳到主要內容

  # 區塊標題（左邊英文、右邊中文，格式是「Projects 實作」）
  projects_en: Projects
  projects_zh: 實作
  projects_all_zh: 全部專案      # /projects/ 整頁列表用的
  notes_en: Notes
  notes_zh: 札記
  about_en: About
  about_zh: 關於我

  # 按鈕與零星文字
  more_projects: 查看更多專案 →
  more_notes: 查看全部札記 →
  notes_empty: 還沒有札記。
  project_live: 實際體驗 ↗
  project_code: 原始碼 ↗
  footer_tagline: Paper & Ink

  # 專案頁上方那塊資訊的欄位標籤
  label_about: About
  label_time: Time              # 期間：這個專案活了多久
  label_build: Build            # 投入：做出第一個能用的版本花了多久
  label_tags: Tags
  build_prefix: 第一版           # 顯示成「第一版 15 days」
  still_updating: 持續更新
  card_updated_suffix: 更新      # 卡片上顯示成「2026.11 更新」

# 專案是 collection，不是 _posts。
# 原因：專案不是「有日期的文章」，放在 _posts 會被迫吃到 /2026/04/20/xxx.html
# 這種日期網址，而且每個列表頁都得寫 where: "layout","project" 來過濾。
# _posts 留給之後真正的文章／筆記。
collections:
  projects:
    output: true
    permalink: /projects/:name/

# 札記（_posts）的網址：/notes/<標題slug>/
# 預設是 /2026/11/18/標題.html，日期塞在網址裡不好讀也不好分享
permalink: /notes/:title/

# Build settings
# NO theme: minima — we use our own _layouts/
future: true
timezone: Asia/Taipei
kramdown:
  hard_wrap: true

plugins:
  - jekyll-feed

# Social Links
social:
  linkedin: https://www.linkedin.com/in/wen-po-chang-842554292/
  # mastodon: https://mastodon.social/@yourname
  email: wpc.walden@gmail.com

goatcounter: walden